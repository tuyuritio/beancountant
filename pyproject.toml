[project]
name = "beancountant"
version = "0.1.1"
description = "A personal finance Telegram bot built for Beancount."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beancount>=3.2.3",
    "beanquery>=0.2.0",
    "dotenv>=0.9.9",
    "langchain>=1.2.17",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.2.1",
    "langgraph>=1.1.10",
    "python-telegram-bot[webhooks]>=22.7",
    "sqlite-vss>=0.1.2",
]

[tool.semantic_release]
branch = "main"
allow_zero_version = true
major_on_zero = false
upload_to_vcs_release = true
version_toml = ["pyproject.toml:project.version"]
commit_message = "chore(release): {version}"
build_command = "python -m pip install uv && uv lock && git add uv.lock"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.ruff]
line-length = 120
