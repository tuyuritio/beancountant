[project]
name = "beancountant"
version = "0.0.0"
description = "A personal finance Telegram bot built for Beancount."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beancount>=3.2.3",
    "beanquery>=0.2.0",
    "dotenv>=0.9.9",
    "langchain>=1.2.17",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.2.1",
    "langgraph>=1.1.10",
    "python-telegram-bot[webhooks]>=22.7",
    "sqlite-vss>=0.1.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.ruff]
line-length = 120
